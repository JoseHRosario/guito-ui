<section class="relative flex min-h-dvh flex-col items-center justify-center bg-base-100 px-8">
  <div class="flex flex-col items-center gap-4">
    <div class="flex items-center gap-3" data-testid="signin-logo">
      <span class="flex size-8 items-center justify-center rounded-lg bg-primary text-base-100">
        <span class="text-base leading-none font-normal">G</span>
      </span>
      <span class="text-4xl font-bold tracking-tight text-base-content">Guito</span>
    </div>
    <p class="text-base text-base-content/60">Personal expense tracker</p>
    <div class="h-11"></div>
    <button
      type="button"
      class="btn btn-primary h-10 w-full max-w-[338px] rounded-lg px-6 font-medium"
      data-testid="signin-button"
      (click)="signIn()"
    >
      <g-icon name="google" class="size-[18px]" />
      <span>Sign in with Google</span>
    </button>
  </div>
  <p class="absolute inset-x-0 bottom-6 px-8 text-center text-xs text-base-content/60" data-testid="signin-legal">
    By continuing, you agree to Guito's Terms of Service and Privacy Policy.
  </p>
</section>
