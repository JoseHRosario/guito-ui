<div class="flex min-h-dvh flex-col bg-base-200">
  <!-- Header -->
  <header class="flex shrink-0 items-center justify-between border-b border-base-content/10 bg-base-100 px-4 py-4 lg:px-12 lg:py-4">
    <div class="flex items-center gap-3">
      <!-- Mobile: hamburger + wordmark -->
      <button type="button" class="flex items-center gap-3 lg:hidden" aria-label="Open menu">
        <g-icon name="menu" class="size-6" />
        <span class="text-2xl font-semibold tracking-tight text-base-content">Guito</span>
      </button>
      <!-- Desktop: logo tile + wordmark -->
      <a routerLink="/" class="hidden items-center gap-3 lg:flex" aria-label="Guito home">
        <span class="flex size-8 items-center justify-center rounded-lg bg-primary text-base-100">
          <span class="text-base font-normal leading-none">G</span>
        </span>
        <span class="text-4xl font-bold tracking-tight text-base-content">Guito</span>
      </a>
    </div>

    <!-- Desktop pill nav (issue #47: real links, route-driven active state) -->
    <nav class="hidden items-center gap-6 lg:flex" aria-label="Main navigation">
      @for (item of nav; track item.label) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: true }"
          #rla="routerLinkActive"
          [class]="
            'rounded-full px-4 py-2 font-normal ' +
            (rla.isActive ? 'bg-base-200 text-base-content font-semibold' : 'text-base-content/50 hover:text-base-content')
          "
          [attr.aria-current]="rla.isActive ? 'page' : null"
          >{{ item.label }}</a
        >
      }
    </nav>

    <div class="flex items-center">
      @if (isAuthenticated()) {
        <!-- Avatar dropdown — placeholder menu (design TBD per guito-api#50). -->
        <div class="relative" data-testid="avatar-menu">
          <button
            type="button"
            class="flex size-10 items-center justify-center rounded-full bg-primary text-base-100 text-sm font-semibold"
            data-testid="header-avatar"
            aria-label="Account menu"
            (click)="toggleMenu()"
            >{{ avatarInitials() }}</button
          >
          @if (menuOpen()) {
            <div class="absolute right-0 z-30 mt-2 rounded-box border border-base-content/10 bg-base-100 shadow-md">
              <button
                type="button"
                class="block w-full rounded-box px-4 py-2 text-left font-normal text-base-content hover:bg-base-200"
                data-testid="sign-out"
                (click)="signOut()"
                >Sign out</button
              >
            </div>
          }
        </div>
      } @else {
        <a routerLink="/signin" [queryParams]="signInQuery()" class="btn btn-primary" aria-label="Sign in">Sign In</a>
      }
    </div>
  </header>

  <main class="flex-1 pb-[86px] lg:pb-0"><router-outlet /></main>

  <!-- Mobile bottom navigation (fixed — always visible, content scrolls beneath; real links, issue #47) -->
  <nav class="fixed inset-x-0 bottom-0 z-20 flex items-center justify-between border-t border-base-content/10 bg-base-100 pt-3 pb-6 lg:hidden" aria-label="Bottom navigation">
    @for (item of nav; track item.label) {
      <a
        [routerLink]="item.path"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: true }"
        #rla="routerLinkActive"
        [class]="
          'flex min-w-0 flex-1 flex-col items-center gap-1 p-1 ' + (rla.isActive ? 'text-primary' : 'text-base-content/60')
        "
        [attr.aria-current]="rla.isActive ? 'page' : null"
      >
        <g-icon [name]="item.icon" class="size-6" />
        <p class="text-sm leading-none font-semibold">{{ item.label }}</p>
      </a>
    }
  </nav>

  <!-- Desktop footer -->
  <footer class="hidden shrink-0 items-center justify-between border-t border-base-content/10 bg-base-100 px-12 py-6 text-sm lg:flex">
    <p class="text-base-content/50">Guito · Personal Expense Tracker</p>
    <p class="text-base-content/50">Stubbed data · No Live API Connection</p>
  </footer>
</div>
