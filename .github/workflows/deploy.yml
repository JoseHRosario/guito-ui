name: deploy

# Deploys the built SPA to S3 + CloudFront after the full check suite passes.
# AWS authentication is OIDC-only (no long-lived keys): the deploy job assumes
# role arn:aws:iam::497087877832:role/guito-ui-deploy, whose trust policy is
# restricted to this repository's workflows. Failures anywhere fail the run.

on:
  push:
    branches: [master, 'feature/**', 'bug/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target (push-to-master deploys production regardless)'
        type: choice
        required: true
        default: production
        options: [production, staging]

permissions:
  contents: read
  id-token: write # required by the AWS OIDC credential action

# Two independent lanes so branch pushes can never cancel a production deploy:
# - deploy-prod (master pushes): queued, never cancelled.
# - deploy-staging (feature/bug pushes): one SHARED staging distribution —
#   concurrent branch deploys supersede each other, so cancel-in-progress makes
#   the NEWEST branch push win instead of a stale queue ordering.
# Manual dispatches get their own per-ref lane.
concurrency:
  group: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' && 'deploy-prod' || 'deploy-staging') || format('deploy-dispatch-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}

env:
  AWS_REGION: eu-west-1

jobs:
  e2e:
    name: e2e (deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Stamp version into environments (issue #53)
        run: ./deploy/stamp.sh

      - name: Build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: E2E smoke
        run: npx playwright test

  deploy:
    name: deploy (S3 + CloudFront)
    needs: e2e
    outputs:
      smoke_url: ${{ steps.resolve-target.outputs.smoke_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: resolve-target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Master pushes → production; any other pushed branch → staging.
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              TARGET=production
            else
              TARGET=staging
            fi
          else
            TARGET="${{ inputs.environment }}"
          fi
          echo "Deploy target: $TARGET"
          if [ "$TARGET" = "staging" ]; then
            echo "S3_BUCKET=guito-ui-staging-site-497087877832" >> "$GITHUB_ENV"
            echo "CF_DISTRIBUTION_ID=E215NA8R2JDTMB" >> "$GITHUB_ENV"
            echo "BUILD_CONFIGURATION=staging" >> "$GITHUB_ENV"
            SMOKE_URL='https://guito-staging.web.kerumirembora.com/'
          else
            echo "S3_BUCKET=guito-ui-site-497087877832" >> "$GITHUB_ENV"
            echo "CF_DISTRIBUTION_ID=E1165HQRHT670N" >> "$GITHUB_ENV"
            echo "BUILD_CONFIGURATION=production" >> "$GITHUB_ENV"
            SMOKE_URL='https://guito.web.kerumirembora.com/'
          fi
          # Export for downstream steps AND emit the job output in the same
          # step: $GITHUB_ENV writes only apply to SUBSEQUENT steps, so the
          # smoke_url output must be echoed from the local variable here.
          echo "SMOKE_URL=$SMOKE_URL" >> "$GITHUB_ENV"
          echo "smoke_url=$SMOKE_URL" >> "$GITHUB_OUTPUT"

      - name: Stamp version into environments (issue #53)
        run: ./deploy/stamp.sh

      - name: Build (tokens + Angular build, ${{ env.BUILD_CONFIGURATION }})
        run: npm run build -- --configuration "${{ env.BUILD_CONFIGURATION }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-ui-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync hashed assets
        run: >
          aws s3 sync dist/guito-ui/browser "s3://${{ env.S3_BUCKET }}"
          --cache-control "public,max-age=31536000,immutable" --delete
          --exclude index.html

      - name: Upload index.html (no-cache)
        run: >
          aws s3 cp dist/guito-ui/browser/index.html
          "s3://${{ env.S3_BUCKET }}/index.html" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ env.CF_DISTRIBUTION_ID }}" --paths "/*"

  smoke:
    name: smoke (deployed URL)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Deployed smoke (stubbed sign-in flow against the live site)
        env:
          # What's real: the target build, S3 assets and the CloudFront SPA
          # fallback for deep links. Google + token exchange stay stubbed.
          # SMOKE_URL is resolved per target in the deploy job.
          SMOKE_URL: ${{ needs.deploy.outputs.smoke_url }}
        run: npx playwright test e2e/deployed-smoke.spec.ts
