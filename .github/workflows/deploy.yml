name: deploy

# Deploys the built SPA to S3 + CloudFront after the full check suite passes.
# AWS authentication is OIDC-only (no long-lived keys): the deploy job assumes
# role arn:aws:iam::497087877832:role/guito-ui-deploy, whose trust policy is
# restricted to this repository's workflows. Failures anywhere fail the run.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required by the AWS OIDC credential action

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: guito-ui-site-497087877832
  CF_DISTRIBUTION_ID: E1165HQRHT670N

jobs:
  e2e:
    name: e2e (deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: E2E smoke
        run: npx playwright test

  deploy:
    name: deploy (S3 + CloudFront)
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tokens + Angular production build)
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-ui-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync hashed assets
        run: >
          aws s3 sync dist/guito-ui/browser "s3://${{ env.S3_BUCKET }}"
          --cache-control "public,max-age=31536000,immutable" --delete
          --exclude index.html

      - name: Upload index.html (no-cache)
        run: >
          aws s3 cp dist/guito-ui/browser/index.html
          "s3://${{ env.S3_BUCKET }}/index.html" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ env.CF_DISTRIBUTION_ID }}" --paths "/*"

  smoke:
    name: smoke (deployed URL)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Deployed smoke (stubbed sign-in flow against the live site)
        env:
          # What's real: the prod build, S3 assets and the CloudFront SPA
          # fallback for deep links. Google + token exchange stay stubbed.
          SMOKE_URL: https://guito.web.kerumirembora.com/
        run: npx playwright test e2e/deployed-smoke.spec.ts
